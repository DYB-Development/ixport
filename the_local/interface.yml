scope: CSV import and export — a mounted engine where a signed-in person sees the mapped imports and the exports the host app registers, each import backed by an importer class and each export by an exporter class the host writes, where an export is either fixed or chosen, and a chosen export lets the account save named templates of picked columns

install:
  - gem "ixport"
  - bin/rails generate ixport:install
  - bin/rails generate ixport:update
  - mount Ixport::Engine
  - Ixport.configure
  - config.authentication_method
  - config.current_person_method
  - config.current_account_method
  - config.layout
  - config.inline_row_limit
  - config.background_runner
  - config.base_controller

develop:
  - Ixport.register_import
  - Ixport::Importer
  - field
  - match_on
  - records
  - person
  - account
  - Ixport::MissingImporter
  - Ixport::MissingExporter
  - Ixport::ImportFailed
  - Ixport.run_import
  - enqueue
  - GET /
  - GET /imports/new
  - POST /imports
  - GET /imports/:import_id/mapping
  - PATCH /imports/:import_id/mapping
  - GET /imports/:import_id/preview
  - POST /imports/:import_id/run
  - GET /imports/:id
  - Ixport.register_export
  - Ixport::Exporter
  - column
  - value
  - GET /exports
  - GET /exports/:id
  - GET /exports/:export_id/templates/new
  - POST /exports/:export_id/templates
  - GET /export_templates/:id
  - GET /export_templates/:id/edit
  - PATCH /export_templates/:id
  - DELETE /export_templates/:id

