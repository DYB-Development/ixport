scope: CSV import and export — a mounted engine where a signed-in person sees the mapped imports and the fixed exports the host app registers, each import backed by an importer class and each export by an exporter class the host writes

install:
  - gem "ixport"
  - bin/rails generate ixport:install
  - mount Ixport::Engine
  - Ixport.configure
  - config.authentication_method
  - config.current_person_method
  - config.current_account_method
  - config.layout
  - config.inline_row_limit

develop:
  - Ixport.register_import
  - Ixport::Importer
  - field
  - match_on
  - records
  - person
  - account
  - Ixport::MissingImporter
  - Ixport::MissingExporter
  - GET /
  - GET /imports/new
  - POST /imports
  - GET /imports/:import_id/mapping
  - PATCH /imports/:import_id/mapping
  - GET /imports/:import_id/preview
  - POST /imports/:import_id/run
  - GET /imports/:id
  - Ixport.register_export
  - Ixport::Exporter
  - column
  - value
  - GET /exports
  - GET /exports/:id

sources:
  - lib/ixport.rb
  - lib/ixport/engine.rb
  - lib/ixport/configuration.rb
  - lib/ixport/registrations.rb
  - lib/ixport/importer.rb
  - lib/generators/ixport/install/install_generator.rb
  - lib/generators/ixport/install/templates/create_ixport_imports.rb.erb
  - config/routes.rb
  - app/controllers/ixport/application_controller.rb
  - app/controllers/ixport/imports_controller.rb
  - app/views/ixport/imports/index.html.erb
  - app/models/ixport/application_record.rb
  - app/models/ixport/import.rb
  - app/controllers/ixport/mappings_controller.rb
  - app/views/ixport/imports/new.html.erb
  - app/views/ixport/mappings/show.html.erb
  - app/models/ixport/row_walk.rb
  - app/controllers/ixport/previews_controller.rb
  - app/views/ixport/previews/show.html.erb
  - app/models/ixport/import_refusal.rb
  - app/controllers/ixport/runs_controller.rb
  - app/views/ixport/imports/show.html.erb
  - lib/generators/ixport/install/templates/create_ixport_import_refusals.rb.erb
  - lib/ixport/exporter.rb
  - app/models/ixport/csv_writer.rb
  - app/controllers/ixport/exports_controller.rb
  - app/views/ixport/exports/index.html.erb
